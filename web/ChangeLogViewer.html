  async function loadChangelog(isManualRefresh=false){const button=$('refreshButton');button.disabled=true;button.textContent='Loading…';$('statusDot').className='status-dot loading';$('statusText').textContent='Loading release notes…';try{const response=await fetch(CHANGELOG_URL,{cache:'no-store',headers:{Accept:'application/json'}});if(!response.ok)throw new Error(`GitHub returned HTTP ${response.status}`);const data=await response.json();if(!data||typeof data!=='object'||!data.releases||typeof data.releases!=='object')throw new Error('JSON format is invalid or missing the releases object');changelogData=data;applyAppMetadata(data);renderTimeline(data);if(isManualRefresh)successfulManualRefreshes=Math.min(MAX_SUCCESSFUL_MANUAL_REFRESHES,successfulManualRefreshes+1)}catch(error){showError(error)}finally{button.disabled=false;button.innerHTML=`${icon('retry',14)} Refresh`;updateRefreshButtonVisibility()}}
  function toggleRelease(version){const isOpen=expandedReleases.has(version);expandedReleases.clear();if(!isOpen)expandedReleases.add(version);if(changelogData)renderTimeline(changelogData)}
  function toast(message){const el=$('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),2600)}
  document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;if(action==='open-release')openReleaseSheet(target.dataset.version,target);if(action==='close-release-sheet')closeReleaseSheet();if(action==='retry')loadChangelog();if(action==='open-upcoming')openUpcomingSheet(target);if(action==='download-latest')downloadLatestVersion(target)});
  function openActionSheet(){const sheet=$('actionSheet'),overlay=$('sheetOverlay');sheet.hidden=false;overlay.hidden=false;document.body.classList.add('sheet-open');sheet.setAttribute('aria-hidden','false');$('optionsButton').setAttribute('aria-expanded','true');requestAnimationFrame(()=>{sheet.classList.add('open');overlay.classList.add('open')});$('sheetClose').focus({preventScroll:true})}
  function closeActionSheet(){const sheet=$('actionSheet'),overlay=$('sheetOverlay');sheet.classList.remove('open');overlay.classList.remove('open');sheet.setAttribute('aria-hidden','true');$('optionsButton').setAttribute('aria-expanded','false');document.body.classList.remove('sheet-open');setTimeout(()=>{if(!sheet.classList.contains('open')){sheet.hidden=true;overlay.hidden=true}},260)}
  function closeViewer(){closeActionSheet();try{window.close()}catch(_){}setTimeout(()=>{if(!document.hidden)toast('You can return to the previous screen now.')},180)}
  $('iconFallback').innerHTML=icon('leaf',41);$('optionsIcon').innerHTML=icon('settings',19);$('optionsChevron').innerHTML=icon('chevronUp',18);$('releaseBackIcon').innerHTML=icon('chevronLeft',19);$('downloadLatestIcon').innerHTML=icon('download',19);document.querySelectorAll('.inline-sheet-close-icon').forEach(el=>el.innerHTML=icon('close',20));document.querySelectorAll('.inline-github-icon').forEach(el=>el.innerHTML=icon('github',22));document.querySelectorAll('.inline-external-icon').forEach(el=>el.innerHTML=icon('external',18));document.querySelectorAll('.inline-sparkles-icon').forEach(el=>el.innerHTML=icon('sparkles',22));document.querySelectorAll('.inline-chevron-icon').forEach(el=>el.innerHTML=icon('chevron',18));
  $('refreshButton').addEventListener('click',()=>loadChangelog(true));$('optionsButton').addEventListener('click',openActionSheet);$('sheetClose').addEventListener('click',closeActionSheet);$('sheetOverlay').addEventListener('click',closeActionSheet);$('releaseBackButton').addEventListener('click',closeReleaseSheet);$('releaseSheetOverlay').addEventListener('click',closeReleaseSheet);$('githubButton').addEventListener('click',closeActionSheet);$('closeButton').addEventListener('click',closeViewer);window.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('releaseSheet').hidden)closeReleaseSheet();else if(event.key==='Escape'&&!$('actionSheet').hidden)closeActionSheet()});
  $('backToTop').innerHTML=icon('arrowUp',23);$('backToTop').addEventListener('click',()=> $('content').scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));$('content').addEventListener('scroll',()=>$('backToTop').classList.toggle('visible',$('content').scrollTop>420),{passive:true});
  loadChangelog();
})();
</script>
